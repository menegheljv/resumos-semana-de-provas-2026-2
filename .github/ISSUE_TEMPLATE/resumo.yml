name: Enviar um resumo
description: Compartilhe um resumo, anotação ou correção com a turma.
title: "[Resumo] "
labels:
  - contribuicao
body:
  - type: dropdown
    id: materia
    attributes:
      label: Matéria
      description: Escolha onde este conteúdo deve ser publicado.
      options:
        - Marketing
        - Marketing Digital
        - Planejamento e Estratégias de Comunicação Integrada
        - Produção Gráfica
    validations:
      required: true
  - type: textarea
    id: resumo
    attributes:
      label: Seu resumo
      description: Escreva o conteúdo com suas palavras e destaque os conceitos mais importantes.
      placeholder: Cole ou escreva seu resumo aqui...
    validations:
      required: true
  - type: textarea
    id: fontes
    attributes:
      label: Fontes
      description: Informe a aula, slide, livro ou link usado como referência.
      placeholder: Ex.: Aula 02 - Inbound e Marketing de Conteúdo Digital
    validations:
      required: true
  - type: checkboxes
    id: revisao
    attributes:
      label: Revisão
      options:
        - label: Confirmei que não incluí dados pessoais ou material que não possa ser compartilhado publicamente.
          required: true
