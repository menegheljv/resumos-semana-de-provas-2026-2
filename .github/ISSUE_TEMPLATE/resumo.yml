name: Corrigir ou sugerir
description: Aponte um erro ou sugira uma melhoria nos resumos e quizzes. Para enviar o seu próprio resumo, use a Biblioteca da turma (pasta do Drive no site).
title: "[Correção] "
labels:
  - contribuicao
body:
  - type: dropdown
    id: materia
    attributes:
      label: Matéria
      options:
        - Marketing
        - Marketing Digital
        - Planejamento e Estratégias de Comunicação Integrada
    validations:
      required: true
  - type: textarea
    id: o-que
    attributes:
      label: O que está errado ou o que pode melhorar?
      description: Diga em qual trecho (resumo, cartão ou número da questão do quiz) e o que você sugere no lugar.
    validations:
      required: true
  - type: textarea
    id: fontes
    attributes:
      label: Fonte
      description: Aula, slide, página do livro ou link que sustenta a correção.
      placeholder: Ex.: Conteúdo 06, slide "As 6 etapas"
    validations:
      required: true
